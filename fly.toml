# fly.toml app configuration file generated for masterthesis-eustat on 2025-03-12T10:05:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'masterthesis-eustat'
primary_region = 'fra'

# Swap gives the 1 GB VM headroom for memory spikes (live MCA/UMAP re-runs)
# instead of the OOM killer restarting the app.
swap_size_mb = 512

[build]

[http_service]
  internal_port = 3838
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
