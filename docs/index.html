<style>
  @font-face{
    font-family:"EB Garamond";
    src:url("fonts/eb-garamond-v30-latin-regular.woff2") format("woff2");
    font-weight:400; font-style:normal; font-display:swap;
  }
  :root{
    --navy:#17356B; --blue:#1B4FC0; --btn:#1E3A8A; --btn-dark:#16307A;
    --grey:#566173; --faint:#6B7688; --line:#D3DCEC; --edge:#DCE3F0;
    --mx:62%; --my:24%;
    --serif:"EB Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#F7F9FC; color:var(--navy); font-family:var(--sans);
       -webkit-font-smoothing:antialiased;
       min-height:100vh; display:flex; align-items:center; justify-content:center;
       padding:56px 28px}
  #wash{position:fixed; inset:0; z-index:0; pointer-events:none;
        background:
          radial-gradient(680px circle at var(--mx) var(--my), rgba(155,185,240,.55), transparent 66%),
          radial-gradient(520px circle at calc(var(--mx) - 260px) calc(var(--my) + 220px), rgba(196,214,246,.45), transparent 68%);}
  main{position:relative; z-index:1; width:100%; max-width:700px; text-align:center}

  h1{font-family:var(--serif); font-size:clamp(42px,8.4vw,64px); font-weight:400;
     letter-spacing:-.012em; line-height:1.04; margin:0 0 16px; color:var(--navy)}
  h1 .lab{color:var(--blue)}
  h1 .tld{color:#8A9BBE}
  .deck{font-family:var(--serif); font-size:clamp(16px,2.8vw,20px); line-height:1.45;
        color:var(--grey); margin:0 0 clamp(38px,7vh,64px)}

  .cta{display:block; width:100%; max-width:440px; margin:0 auto 14px;
       background:var(--btn); color:#fff; text-decoration:none; border-radius:6px;
       padding:22px 24px; font-size:clamp(18px,2.9vw,22px); line-height:1.3;
       transition:background .15s ease}
  .cta small{display:block; font-size:clamp(12.5px,1.7vw,14px); color:#B9C7EA; margin-top:6px}
  .cta:hover{background:#16307A}

  .row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
       max-width:640px; margin:0 auto}
  .row a{display:flex; align-items:center; justify-content:center; gap:9px;
         background:rgba(255,255,255,.82); border:1px solid var(--edge);
         border-radius:6px; color:#1A2740; text-decoration:none;
         padding:15px 10px; font-size:clamp(13px,1.9vw,15px); line-height:1.3;
         transition:border-color .15s ease, background .15s ease}
  .row a:hover{background:#fff; border-color:var(--blue)}
  .row svg{width:17px; height:17px; fill:var(--blue); flex:none}

  .cta:focus-visible,.row a:focus-visible{outline:3px solid var(--navy); outline-offset:3px}

  @media (max-width:560px){
    .row{grid-template-columns:1fr}
    body{padding:40px 22px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>

<script>
(function () {
  var wash = document.getElementById('wash');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var w = innerWidth, h = innerHeight;
  var tx = w * .62, ty = h * .24, cx = tx, cy = ty, pointer = false, raf;

  addEventListener('resize', function () { w = innerWidth; h = innerHeight; });
  addEventListener('pointermove', function (e) {
    tx = e.clientX; ty = e.clientY; pointer = true;
  }, { passive: true });

  function paint() {
    wash.style.setProperty('--mx', cx.toFixed(1) + 'px');
    wash.style.setProperty('--my', cy.toFixed(1) + 'px');
  }
  if (reduce) { paint(); return; }

  function loop() {
    if (!pointer) {
      var t = Date.now() / 3400;
      tx = w * .62 + Math.cos(t) * w * .14;
      ty = h * .24 + Math.sin(t * 1.3) * h * .09;
    }
    cx += (tx - cx) * .07; cy += (ty - cy) * .07;
    paint();
    raf = requestAnimationFrame(loop);
  }
  loop();

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) cancelAnimationFrame(raf); else loop();
  });
})();
</script>
